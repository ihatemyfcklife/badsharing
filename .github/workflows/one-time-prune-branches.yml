name: One-time cleanup of merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune-merged-branches:
    if: github.repository == 'ihatemyfcklife/badsharing'
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged PRs and safely delete old branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_merged_and_prune() {
            local pr_number="$1"
            local branch_name="$2"
            local expected_sha="$3"
            local merged
            merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.merged')"
            if [[ "$merged" != "true" ]]; then
              echo "PR #$pr_number is not merged; refusing branch deletion."
              exit 1
            fi
            local current_sha
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch_name" --jq '.commit.sha')"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "Branch $branch_name moved; refusing deletion."
              exit 1
            fi
            echo "Deleting already-merged branch: $branch_name"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch_name"
          }
          ensure_merged_and_prune 1 "fix/robust-transfer-and-peer-mesh" "b91b88c375b3029c30708f13fe1d62ba21ec4076"
          ensure_merged_and_prune 2 "feat/automatic-webrtc-swarms" "40f79541288d81782dbbec8d824b91fc618239d1"
          echo "Remaining branches:"
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
